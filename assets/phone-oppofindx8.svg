<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none">
  <defs>
    <linearGradient id="oppoBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <!-- Elegant Pearl White Body with Cosmos Ring -->
  <rect x="75" y="35" width="170" height="330" rx="26" fill="url(#oppoBack)" stroke="#94A3B8" stroke-width="2"/>
  <!-- Circular Hasselblad Ring -->
  <circle cx="160" cy="130" r="58" fill="#0F172A" stroke="#E2E8F0" stroke-width="3"/>
  <!-- Hasselblad 'H' Logo in center -->
  <text x="160" y="136" font-family="serif" font-size="18" font-weight="900" fill="#F8FAFC" text-anchor="middle">H</text>
  <!-- 4 Periscope & Ultra Wide lenses -->
  <circle cx="138" cy="115" r="11" fill="#020617"/>
  <circle cx="182" cy="115" r="11" fill="#020617"/>
  <circle cx="138" cy="145" r="11" fill="#020617"/>
  <rect x="175" y="140" width="14" height="12" rx="2" fill="#020617"/>
</svg>
