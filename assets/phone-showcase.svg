<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" fill="none">
  <defs>
    <radialGradient id="bannerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090B0E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="250" cy="190" r="180" fill="url(#bannerGlow)"/>

  <!-- Left Phone (Galaxy S25 Ultra angled) -->
  <g transform="translate(40, 20) rotate(-6 150 180)">
    <rect x="60" y="30" width="140" height="290" rx="12" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <circle cx="90" cy="65" r="12" fill="#020617" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="90" cy="100" r="12" fill="#020617" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="90" cy="135" r="12" fill="#020617" stroke="#94A3B8" stroke-width="2"/>
  </g>

  <!-- Right Phone (iPhone 16 Pro Desert Titan front) -->
  <g transform="translate(180, 10) rotate(5 150 180)">
    <rect x="60" y="30" width="145" height="300" rx="26" fill="#181512" stroke="#C8B7A6" stroke-width="2.5"/>
    <rect x="66" y="36" width="133" height="288" rx="22" fill="#0E0D0C"/>
    <!-- Screen wallpaper glow -->
    <path d="M66 180 Q130 110 199 170 L199 324 L66 324 Z" fill="rgba(212, 155, 106, 0.25)"/>
    <rect x="110" y="44" width="45" height="12" rx="6" fill="#000"/>
  </g>

  <!-- Futuristic Floating Badge -->
  <rect x="180" y="270" width="140" height="40" rx="20" fill="rgba(16, 20, 25, 0.95)" stroke="#00E5FF" stroke-width="1.5"/>
  <text x="250" y="295" font-family="sans-serif" font-size="12" font-weight="800" fill="#00E5FF" text-anchor="middle" letter-spacing="1">GALAXY AI &amp; APPLE</text>
</svg>
