<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none">
  <defs>
    <linearGradient id="s25Back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="s25Screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A111E"/>
    </linearGradient>
  </defs>
  <!-- S25 Ultra Boxy Sharp-radius Titanium Frame -->
  <rect x="40" y="32" width="165" height="336" rx="10" fill="url(#s25Back)" stroke="#64748B" stroke-width="2"/>
  <!-- Samsung Floating Camera Rings -->
  <circle cx="68" cy="65" r="14" fill="#0B0F19" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="68" cy="102" r="14" fill="#0B0F19" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="68" cy="139" r="14" fill="#0B0F19" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="98" cy="72" r="8" fill="#0B0F19" stroke="#64748B" stroke-width="2"/>
  <circle cx="98" cy="102" r="10" fill="#0B0F19" stroke="#64748B" stroke-width="2"/>

  <!-- Front Facing Model (QHD+ Screen) -->
  <rect x="115" y="44" width="165" height="336" rx="10" fill="#070A0F" stroke="#94A3B8" stroke-width="2"/>
  <rect x="120" y="49" width="155" height="326" rx="7" fill="url(#s25Screen)"/>
  <!-- Infinity-O Punch hole -->
  <circle cx="197" cy="62" r="4" fill="#030712"/>
  <!-- S-Pen Hint -->
